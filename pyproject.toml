[project]
name = "rag-demo"
version = "0.1.0"
description = "RAG Demo - Chroma 向量库 + 知识检索"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-retrievers-bm25>=0.8.0",
    # Demo 2 本地 LLM（rag_demo_llamaindex.py 直接 import LlamaCPP）。
    # 它的依赖 llama-cpp-python 无 PyPI 预编译 wheel，取源见文件底部配置。
    "llama-index-llms-llama-cpp>=0.5.0",
    # 上限 0.3.19：预编译源（llama-cpp-cpu）目前对 cp313-win_amd64 只出到 0.3.19，
    # 再高只能拿源码包 → Windows 触发本地 C++ 编译。显式声明 + 锁源见文件底部。
    "llama-cpp-python>=0.3.5,<0.3.20",
    # download_model.py 直接 import hf_hub_download
    "huggingface_hub>=0.23",
    # 评测集生成（gen_evalset.py）：RAGAS + 智谱 GLM OpenAI 兼容接口
    # ragas 0.4.3 导入 langchain_community.chat_models.vertexai，该模块在
    # langchain-community 0.4.0 被移除，故 langchain-* 锁 0.3 系列（ragas 本身用 0.4.3）。
    # 仅影响 gen_evalset，lab 与两个 demo 走 llama_index，不受影响。
    # rapidfuzz 是 ragas OverlapScoreBuilder 的隐性依赖，不会自动安装，须显式声明。
    "ragas>=0.4.3,<0.5",
    "rapidfuzz>=3.0",
    "langchain-community>=0.3.0,<0.4",
    "langchain-openai>=0.3.0,<0.4",
    "langchain-huggingface>=0.3.0,<0.4",
    # gen_evalset.py 直接 import dotenv 读取项目根 .env
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
# 多镜像源下允许跨源取最优版本（否则某源有旧版包会挡住另一源的新版）
index-strategy = "unsafe-best-match"

# 国内镜像：清华为主源，阿里云兜底（单源偶发缺新版本包时自动 fallback）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

# llama-cpp-python 在 PyPI 只有源码包，Windows 上安装会触发本地 C++ 编译（极易失败）。
# 官方提供各平台预编译 wheel；explicit = true 表示该源只服务于显式绑定的包，
# 不会成为其它依赖的候选源，避免影响正常解析。
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
